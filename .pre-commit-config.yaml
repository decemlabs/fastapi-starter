# Generated by OrchestKit Claude Plugin
# Created: 2026-07-26

# Fast hooks only: ruff runs in milliseconds. The slow gates (mypy, pyright,
# pytest) stay in `make check` and CI — duplicating them per commit makes
# committing miserable without adding safety CI doesn't already provide.
# Install with: make hooks
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key
