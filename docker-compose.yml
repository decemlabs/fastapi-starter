services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      # Override when a local Postgres already owns 5432: POSTGRES_PORT=55432
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot migration step: a failed migration is a distinct failed service,
  # not an api that dies mid-startup — and replicas never race each other.
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE__URL: postgresql+asyncpg://postgres:postgres@db:5432/app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    environment:
      # In-network endpoints override the localhost values from .env.
      DATABASE__URL: postgresql+asyncpg://postgres:postgres@db:5432/app
      REDIS__URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    develop:
      # `make watch` (docker compose watch): code syncs into the container,
      # dependency changes trigger a rebuild.
      watch:
        - action: sync+restart
          path: ./app
          target: /app/app
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock

volumes:
  pgdata:
