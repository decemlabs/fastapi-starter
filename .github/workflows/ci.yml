# Created: 2026-07-26

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint · format · types · layer contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pyright
      - run: uv run lint-imports

  test:
    name: Tests + coverage (SQLite tier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: uv run pytest --cov

  test-postgres:
    name: Postgres tier (migrations + dialect + drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      # testcontainers manages the postgres:17 container itself; this runs
      # the real Alembic chain and the autogenerate drift check.
      - run: uv run pytest -m pg

  docker:
    name: Docker build + suite inside the artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build test stage and run the suite in it
        run: |
          docker build --target test -t app-test .
          docker run --rm app-test
      - name: Build runtime image
        run: docker build --target runtime -t app .
